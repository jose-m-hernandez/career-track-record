name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  barred-strings:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Barred-strings scan
        env:
          BARRED_STRINGS: ${{ secrets.BARRED_STRINGS }}
          BARRED_ALLOW: ${{ secrets.BARRED_ALLOW }}
        run: python3 ci/barred_strings.py

  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m pip install --force-reinstall --no-deps --require-hashes -r ci/requirements-build.txt
      - run: python3 -m unittest discover -s tests -t . -v
