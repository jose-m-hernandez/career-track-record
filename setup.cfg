[metadata]
name = career-track-record
version = attr: career_track_record.__version__

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    track-record = career_track_record.cli:main

[options.package_data]
    career_track_record = data/*.json
